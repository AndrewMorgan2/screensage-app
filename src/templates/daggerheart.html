<div class="dh-container">
    <div class="dh-header">
        <h2>Daggerheart Character</h2>
    </div>

    <div class="dh-grid">
        <label>Name <input type="text" id="dhName" placeholder="Character name"></label>
        <label>Class <select id="dhClass"></select></label>
        <label>Subclass <select id="dhSubclass"></select></label>
        <label>Ancestry <select id="dhAncestry"></select></label>
        <label>Community <select id="dhCommunity"></select></label>
        <label>Armor <select id="dhArmor"></select></label>
        <label>Weapon <select id="dhWeapon"></select></label>
    </div>

    <h3>Traits <span class="dh-hint">assign +2, +1, +1, 0, 0, -1</span></h3>
    <div class="dh-grid" id="dhTraits"></div>
    <div id="dhTraitStatus" class="dh-hint"></div>

    <h3>Summary</h3>
    <div id="dhSummary" class="dh-summary"></div>

    <button id="dhSaveBtn" class="dh-btn">Create Character</button>
    <div id="dhMessage" class="dh-hint"></div>
</div>

<style>
/* Player-facing page: hide the site nav bar */
.navbar { display: none; }
.dh-container { max-width: 900px; margin: 0 auto; padding: 20px; }
.dh-header {
    display: flex; justify-content: space-between; align-items: center;
    border-bottom: 2px solid var(--border-color); padding-bottom: 10px; margin-bottom: 20px;
}
.dh-header h2 { margin: 0; color: var(--primary-color); }
.dh-container h3 { color: var(--primary-color); margin-top: 24px; }
.dh-hint { color: var(--secondary-text); font-size: 13px; font-weight: normal; }
.dh-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
.dh-grid label { display: flex; flex-direction: column; gap: 4px; color: var(--secondary-text); font-size: 13px; }
.dh-grid input, .dh-grid select {
    background-color: var(--card-bg-color); border: 1px solid var(--border-color);
    border-radius: 5px; padding: 8px 10px; font-size: 14px; color: var(--text-color);
}
.dh-summary {
    background-color: var(--card-bg-color); border: 1px solid var(--border-color);
    border-radius: 5px; padding: 12px; color: var(--text-color); line-height: 1.6;
}
.dh-btn {
    margin-top: 20px; background-color: var(--primary-color); color: white; border: none;
    padding: 10px 20px; border-radius: 5px; cursor: pointer; font-size: 14px;
}
.dh-btn:hover { background-color: var(--secondary-color); }
.dh-btn:disabled { opacity: 0.5; cursor: not-allowed; }
.dh-ok { color: var(--success-color); }
.dh-err { color: var(--error-color); }
</style>
